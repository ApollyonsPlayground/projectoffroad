# iOS native shell — sync Capacitor + Xcode build on GitHub macOS runners.
# Your WebView loads production by default (capacitor.config.ts → https://socaloffroaders.com/).
#
# Triggers:
#   • workflow_dispatch — manual “Run workflow” (recommended while iterating).
#   • push — optional; comment out if you don’t want minutes burned on every push.
#
# Simulator build = no Apple signing secrets (good smoke test).
# App Store .ipa = needs certificates + provisioning profile or App Store Connect API key (add later).

name: iOS (Capacitor)

on:
  workflow_dispatch:
    inputs:
      sign_archive:
        description: 'Run signed Release archive (requires signing secrets below)'
        required: false
        default: false
        type: boolean
  # push:
  #   branches: [socal-off-roaders-app]

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub Actions: run checkout/setup-node on Node 24 (Node 20 runner deprecation).
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '22'

jobs:
  ios-build:
    runs-on: macos-14
    timeout-minutes: 45
    # Ensure composite JS actions see Node 24 even if workflow-level env quirks occur.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Runner already ships Xcode; avoids third-party action failures / Node 20 wrappers.
      - name: Xcode version
        run: xcodebuild -version

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Production remote URL — do not point CI at localhost unless you add adb reverse etc.
      - name: Install JS dependencies
        run: npm ci

      - name: Scaffold iOS project if missing
        run: |
          if [ ! -f ios/App/Podfile ]; then
            echo "Adding Capacitor iOS platform (first run)..."
            npx cap add ios
          fi

      - name: Capacitor sync (iOS)
        run: npx cap sync ios

      - name: CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Xcode workspace / schemes (debug)
        working-directory: ios/App
        run: xcodebuild -workspace App.xcworkspace -list

      - name: List available simulators (debug)
        run: xcrun simctl list devices available | head -60

      - name: Build for iOS Simulator (smoke test)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY='-' \
            CODE_SIGNING_REQUIRED=NO \
            build

      # ── Optional: signed Release archive (set workflow input + repo secrets) ────────
      # Required secrets (example naming — adjust to match your Apple setup):
      #   BUILD_CERTIFICATE_BASE64   — base64 of .p12 distribution cert
      #   P12_PASSWORD               — .p12 password
      #   BUILD_PROVISION_PROFILE_BASE64 — base64 of App Store provisioning profile
      #   KEYCHAIN_PASSWORD          — temp keychain password (any random string)
      #
